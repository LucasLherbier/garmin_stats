name: Weekly Garmin Sync

on:
  schedule:
    # Runs at 02:00 UTC every Monday
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  extract_garmin_data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install --force-reinstall --no-deps garminconnect==0.2.30
        python -c "from importlib.metadata import version; v=version('garminconnect'); assert v=='0.2.30', f'Expected garminconnect 0.2.30, got {v}'"

    - name: Calculate Monday 2 Weeks Ago
      run: |
        MONDAY_DATE=$(date -d "14 days ago" +%Y-%m-%d)
        echo "Calculated start date: $MONDAY_DATE"
        echo "MONDAY_DATE=$MONDAY_DATE" >> $GITHUB_ENV

    - name: Garmin extract, summaries, and wellness
      env:
        GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        GCP_DATASET_ID: ${{ secrets.GCP_DATASET_ID }}
        GCP_BUCKET_NAME: ${{ secrets.GCP_BUCKET_NAME }}
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        USER_EMAIL: ${{ secrets.USER_EMAIL }}
        USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        GARMINTOKENS: ${{ secrets.GARMINTOKENS }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        PYTHONPATH: .
      run: |
        python scripts/weekly_garmin_sync.py --start_date $MONDAY_DATE
